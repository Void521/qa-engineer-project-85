---
functional:
  - Два игрока могут соревноваться друг с другом в решении одной и той же задачи.
  - Игроки видят процесс написания кода друг у друга в реальном времени.
  - Система проверяет отправленные решения на тестах и определяет победителя.
  - Пользователи могут просматривать таблицу рейтингов, формируемую по результатам игр.
  - Пользователь может сыграть партию против бота.
  - Пользователь может создать игру и пригласить друга по уникальной ссылке.
  - Пользователь может выбрать язык программирования для решения задачи.
  - Пользователь может авторизоваться, а также просматривать свой профиль и историю игр.

non-functional:
  - Сайт разработан с учётом удобства использования и оптимизирован для высокой скорости работы.
  - Сайт безопасен и защищает персональные данные пользователей.
  - Сайт корректно отображается и удобен на мобильных устройствах.
  - Сайт совместим с последними версиями популярных браузеров (Chrome, Firefox, Safari, Edge).
  - Сайт выдерживает высокую нагрузку — не менее 1000 одновременных пользователей без деградации работы.
  - Выполнение пользовательского кода происходит в изолированной среде (sandbox) с лимитами по времени и памяти.
  - Сервис стабильно доступен для реальных пользователей и устойчив к сбоям.

implicit:
  - Оба игрока начинают раунд одновременно и в равных условиях.
  - Игроки не могут подсмотреть эталонное решение, обойти тесты или сфальсифицировать результат.
  - При обрыве связи или выходе одного из игроков партия корректно обрабатывается (переподключение, таймаут или завершение).
  - Существует механизм подбора соперников (matchmaking) для начала случайной игры.
  - Результаты сыгранных партий сохраняются между сессиями и корректно учитываются в рейтинге.
  - Интерфейс предоставляет понятную обратную связь о статусе игры, ходе тестов и ошибках.
