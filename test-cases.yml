
- summary: |
    Успешная авторизация через GitHub
  requirement: |
    Пользователь должен иметь возможность авторизоваться через GitHub
  prerequisites: |
    Пользователь не авторизован в Codebattle
    У пользователя есть действующий аккаунт GitHub
  test-data: |
    Действующий аккаунт GitHub
  steps:
    - Открыть страницу Codebattle
    - Нажать Sign in
    - Нажать Sign in with Github
    - Завершить авторизацию через GitHub
  expected-result: |
    Пользователь успешно авторизован в Codebattle
    В интерфейсе отображается имя пользователя

- summary: |
    Создание игры против бота с выбором уровня сложности и задачи
  requirement: |
    Пользователь должен иметь возможность играть против бота и выбирать уровень сложности и задачу
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта страница Lobby
  test-data: |
    Тип игры - Bot
    Уровень сложности - Hard
    Задача - rect_area
  steps:
    - Нажать Create battle
    - Выбрать тип игры Bot
    - Выбрать уровень сложности Hard
    - Выбрать задачу rect_area
    - Нажать Create battle в форме
  expected-result: |
    Создаётся новая игра против бота
    Открывается игровой интерфейс
    Отображается выбранная задача rect_area
    Указан выбранный уровень сложности Hard

- summary: |
    Выбор языка программирования и редактирование кода
  requirement: |
    Пользователь должен иметь возможность выбирать язык программирования и редактировать код в игровом редакторе
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта активная игра
  test-data: |
    Язык программирования - Python
    Тестовый код - const x = 10;
  steps:
    - Открыть список языков программирования
    - Выбрать Python
    - Ввести тестовый код в редактор
    - Изменить значение переменной с 10 на 20
  expected-result: |
    В редакторе выбран Python
    Отображается шаблон решения для выбранного языка
    Изменённый код отображается в редакторе

- summary: |
    Проверка неправильного решения задачи
  requirement: |
    Система должна проверять отправленные решения на тестах и отображать результаты проверки
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта активная игра с задачей rect_area
    Выбран язык Python
  test-data: |
    Неправильное решение - def solution(width, length): return 0
  steps:
    - Ввести неправильное решение в редактор
    - Нажать Run
    - Дождаться завершения проверки
  expected-result: |
    Запускается проверка решения
    Отображается информация о проваленных тестах
    Игра продолжается

- summary: |
    Успешное решение задачи и победа в матче против бота
  requirement: |
    Система должна проверять правильность решения и определять победителя игры
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта активная игра против бота
    Бот ещё не завершил задачу
  test-data: |
    Язык программирования - Python
    Правильное решение текущей задачи
  steps:
    - Выбрать Python
    - Ввести правильное решение задачи
    - Нажать Run
    - Дождаться завершения проверки
  expected-result: |
    Все тесты пройдены успешно
    Игра завершается победой пользователя
    Отображается сообщение о победе
    Пользователю засчитывается результат Won

- summary: |
    Отображение прогресса и редактора кода соперника в реальном времени
  requirement: |
    Пользователи должны видеть процесс написания кода друг у друга в реальном времени
  prerequisites: |
    Два пользователя находятся в активном совместном матче
    Открыты две независимые сессии Codebattle
  test-data: |
    Несколько строк тестового кода
  steps:
    - Пользователю A ввести несколько строк кода в редактор
    - Пользователю B посмотреть на редактор соперника
    - Пользователю B проверить отображение изменений
  expected-result: |
    Изменения кода пользователя A отображаются в редакторе соперника
    Обновление происходит в реальном времени без перезагрузки страницы

- summary: |
    Создание игры со случайным соперником и присоединение второго игрока
  requirement: |
    Два игрока должны иметь возможность соревноваться друг с другом в одной игре
  prerequisites: |
    Два пользователя авторизованы в Codebattle
    Оба пользователя находятся в Lobby
    У пользователей нет активных игр
  test-data: |
    Тип игры - Random player
    Уровень сложности - Elementary
    Задача - rect_area
  steps:
    - Пользователю A нажать Create battle
    - Выбрать Random player и уровень Elementary
    - Выбрать задачу rect_area
    - Создать игру
    - Пользователю B открыть Join a battle
    - Найти ожидающую игру пользователя A
    - Нажать Fight
  expected-result: |
    Пользователь B успешно присоединяется к игре пользователя A
    В обеих сессиях открывается одна и та же игра
    Отображаются оба игрока и их редакторы
    Запускается таймер игры

- summary: |
    Создание приватной игры и приглашение друга по уникальной ссылке
  requirement: |
    Пользователь должен иметь возможность создать приватную игру и пригласить друга по уникальной ссылке
  prerequisites: |
    Два пользователя авторизованы в Codebattle
    Открыта страница Lobby
  test-data: |
    Тип игры - With a friend
    Уровень сложности - Elementary
    Задача - rect_area
  steps:
    - Пользователю A нажать Create battle
    - Выбрать With a friend
    - Выбрать уровень сложности Elementary
    - Выбрать задачу rect_area
    - Создать игру и скопировать ссылку приглашения
    - Пользователю B открыть ссылку в другом браузере
    - Присоединиться к игре
  expected-result: |
    Пользователь B успешно подключается к приватной игре
    В обеих сессиях отображается одна и та же игра
    Отображаются оба участника и запускается таймер

- summary: |
    Отправка сообщения в игровой чат
  requirement: |
    Пользователь должен иметь возможность общаться с соперником во время игры
  prerequisites: |
    Два пользователя находятся в активной совместной игре
    Игровой чат доступен
  test-data: |
    Сообщение - Hello!
  steps:
    - Ввести сообщение Hello! в поле чата
    - Отправить сообщение
    - Проверить отображение сообщения в обеих сессиях
  expected-result: |
    Сообщение успешно отправлено
    Сообщение отображается в игровом чате обоих пользователей

- summary: |
    Просмотр рейтинга пользователей и переключение периода
  requirement: |
    Пользователь должен иметь возможность просматривать рейтинг игроков
  prerequisites: |
    Открыта главная страница или Lobby Codebattle
  test-data: |
    Периоды рейтинга - за неделю, за месяц, за всё время
  steps:
    - Перейти в раздел рейтинга игроков
    - Выбрать период за неделю
    - Выбрать период за месяц
    - Выбрать период за всё время
  expected-result: |
    Отображается таблица рейтинга игроков
    В таблице указаны имена пользователей и их рейтинговые показатели
    При переключении периода отображаются соответствующие данные

- summary: |
    Определение поражения пользователя после победы соперника
  requirement: |
    Система должна определять победителя и проигравшего после успешного решения задачи одним из игроков
  prerequisites: |
    Пользователь авторизован в Codebattle
    Создана активная игра против бота
    Бот ещё не завершил задачу
  test-data: |
    Неправильное решение - def solution(width, length): return 0
  steps:
    - Ввести неправильное решение в редактор
    - Нажать Run
    - Не отправлять правильное решение
    - Дождаться успешного решения задачи ботом
  expected-result: |
    Игра завершается после успешного решения задачи ботом
    Пользователю отображается сообщение You lost
    Пользователю засчитывается результат Lost
    Боту засчитывается результат Won

- summary: |
    Завершение игры по истечении установленного времени
  requirement: |
    Игра должна автоматически завершаться по истечении установленного времени
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта страница Lobby
  test-data: |
    Тип игры - Bot
    Уровень сложности - Hard
    Время игры - 1 min
    Задача - Random task
  steps:
    - Нажать Create battle
    - Выбрать Bot и уровень сложности Hard
    - Установить время игры 1 min
    - Создать игру
    - Не отправлять решение
    - Дождаться окончания таймера
  expected-result: |
    По истечении одной минуты игра завершается
    Отображается сообщение Time is over

- summary: |
    Завершение игры после добровольной сдачи пользователя
  requirement: |
    Пользователь должен иметь возможность сдаться и завершить игру досрочно
  prerequisites: |
    Пользователь авторизован в Codebattle
    Открыта активная игра
    Игра ещё не завершена
  test-data: |
    Действие - Give up
  steps:
    - Открыть меню More своего редактора
    - Выбрать Give up
    - В диалоговом окне Give up? подтвердить действие
  expected-result: |
    Игра завершается досрочно
    Пользователю отображается сообщение You gave up
    Пользователю засчитывается результат Gave up
    Сопернику засчитывается результат Won

- summary: |
    Корректное завершение игры при потере соединения одного из игроков
  requirement: |
    Система должна корректно обрабатывать обрыв соединения одного из игроков во время матча
  prerequisites: |
    Два пользователя находятся в активной совместной игре
    Открыты две независимые сессии Codebattle
  test-data: |
    Действие - отключение интернет-соединения пользователя A
  steps:
    - Запустить совместную игру двух пользователей
    - Отключить интернет-соединение пользователя A
    - Дождаться обработки потери соединения
    - Проверить состояние игры в обеих сессиях
  expected-result: |
    Система корректно обрабатывает потерю соединения
    Пользователь B получает информацию о состоянии соперника
    Игра завершается или восстанавливается в соответствии с предусмотренной логикой приложения
