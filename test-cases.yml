- summary: |
    Проверка создания игры между двумя игроками
  requirement: |
    Два игрока могут соревноваться друг с другом в решении одной и той же задачи
  prerequisites: |
    - Два пользователя авторизованы в системе
    - Оба пользователя находятся на сайте Codebattle
  test-data: |
    - Игрок 1: user1
    - Игрок 2: user2
  steps:
    - Нажать кнопку создания игры
    - Выбрать игру с другим пользователем
    - Дождаться подключения второго игрока
    - Проверить отображение игровой комнаты
  expected-result: |
    - Создана игровая комната
    - Оба игрока подключены к одной игре
    - Обоим игрокам доступна одна и та же задача

- summary: |
    Проверка отображения процесса написания кода соперника в реальном времени
  requirement: |
    Игроки видят процесс написания кода друг у друга в реальном времени
  prerequisites: |
    - Два пользователя подключены к одной игровой комнате
    - Игра началась
  test-data: |
    - Игрок 1: user1
    - Игрок 2: user2
  steps:
    - Игрок 1 вводит код в редакторе
    - Проверить экран игрока 2
    - Игрок 2 вводит код в редакторе
    - Проверить экран игрока 1
  expected-result: |
    - Игрок 2 видит изменения кода игрока 1
    - Игрок 1 видит изменения кода игрока 2
    - Изменения отображаются без необходимости обновлять страницу

- summary: |
    Проверка определения победителя после отправки решения
  requirement: |
    Система проверяет отправленные решения на тестах и определяет победителя
  prerequisites: |
    - Два игрока находятся в одной игровой комнате
    - Игра началась
  test-data: |
    - Решение игрока 1: корректное
    - Решение игрока 2: некорректное
  steps:
    - Игрок 1 вводит правильное решение задачи
    - Игрок 2 вводит неправильное решение задачи
    - Игрок 1 отправляет решение на проверку
    - Дождаться завершения проверки
  expected-result: |
    - Система запускает проверку решения на тестах
    - Корректное решение проходит тесты
    - Игроку 1 присваивается победа
    - Результат игры отображается обоим игрокам

- summary: |
    Проверка отображения таблицы рейтингов
  requirement: |
    Пользователи могут просматривать таблицу рейтингов, формируемую по результатам игр
  prerequisites: |
    - Пользователь авторизован
    - В системе имеются завершённые игры
  test-data: |
    - Несколько пользователей с разным количеством побед
  steps:
    - Открыть страницу рейтинга
    - Проверить наличие списка пользователей
    - Проверить отображение рейтинговых позиций
    - Сравнить позиции пользователей с результатами их игр
  expected-result: |
    - Таблица рейтингов отображается
    - Пользователи расположены в соответствии с рейтингом
    - Рейтинговые данные соответствуют результатам сыгранных партий

- summary: |
    Проверка возможности сыграть против бота
  requirement: |
    Пользователь может сыграть партию против бота
  prerequisites: |
    - Пользователь авторизован
  test-data: |
    - Тип игры: против бота
  steps:
    - Нажать кнопку создания игры
    - Выбрать режим игры против бота
    - Дождаться начала игры
    - Проверить наличие бота в качестве соперника
  expected-result: |
    - Игровая комната успешно создана
    - В качестве соперника отображается бот
    - Пользователь может начать решать задачу

- summary: |
    Проверка создания игры по приглашению друга
  requirement: |
    Пользователь может создать игру и пригласить друга по уникальной ссылке
  prerequisites: |
    - Пользователь авторизован
    - Второй пользователь имеет доступ к сайту
  test-data: |
    - Пользователь 1: user1
    - Пользователь 2: user2
  steps:
    - Нажать кнопку создания игры
    - Выбрать режим игры с другом
    - Создать игровую комнату
    - Скопировать ссылку-приглашение
    - Открыть ссылку в другом браузере или сессии
    - Подключиться к игре под вторым пользователем
  expected-result: |
    - Создана уникальная ссылка для приглашения
    - Второй пользователь может перейти по ссылке
    - Второй пользователь подключается к созданной игровой комнате
    - Оба пользователя видят одну игровую комнату

- summary: |
    Проверка выбора языка программирования
  requirement: |
    Пользователь может выбрать язык программирования для решения задачи
  prerequisites: |
    - Пользователь находится в игровой комнате
  test-data: |
    - Языки программирования: JavaScript, Python, Ruby
  steps:
    - Открыть список доступных языков программирования
    - Выбрать JavaScript
    - Проверить выбранный язык
    - Открыть список языков повторно
    - Выбрать Python
    - Проверить выбранный язык
  expected-result: |
    - Список доступных языков отображается
    - Пользователь может выбрать нужный язык
    - Выбранный язык отображается в редакторе
    - Редактор использует синтаксис выбранного языка

- summary: |
    Проверка авторизации пользователя
  requirement: |
    Пользователь может авторизоваться в системе
  prerequisites: |
    - Пользователь зарегистрирован в системе
    - Пользователь не авторизован
  test-data: |
    - Логин: test_user
    - Пароль: Test123456
  steps:
    - Открыть страницу авторизации
    - Ввести корректный логин
    - Ввести корректный пароль
    - Нажать кнопку входа
  expected-result: |
    - Пользователь успешно авторизован
    - Отображается главная страница
    - В интерфейсе отображается профиль пользователя

- summary: |
    Проверка просмотра профиля пользователя
  requirement: |
    Пользователь может просматривать свой профиль
  prerequisites: |
    - Пользователь авторизован
  test-data: |
    - Учетная запись: test_user
  steps:
    - Открыть меню пользователя
    - Перейти в профиль
    - Проверить отображаемую информацию
  expected-result: |
    - Страница профиля открывается
    - Отображается информация о пользователе
    - Данные профиля соответствуют авторизованной учетной записи

- summary: |
    Проверка просмотра истории игр
  requirement: |
    Пользователь может просматривать историю игр
  prerequisites: |
    - Пользователь авторизован
    - Пользователь сыграл несколько партий
  test-data: |
    - Завершённые игры пользователя
  steps:
    - Открыть профиль пользователя
    - Перейти в историю игр
    - Проверить список завершённых партий
    - Открыть одну из завершённых игр
  expected-result: |
    - История игр отображается
    - В истории присутствуют сыгранные партии
    - Результаты партий соответствуют фактическим результатам игр

    - summary: |
    Проверка удобства использования игрового интерфейса
  requirement: |
    Сайт разработан с учётом удобства использования
  prerequisites: |
    - Пользователь авторизован
    - Пользователь находится в игровой комнате
  test-data: |
    - Игровая комната
  steps:
    - Открыть игровую комнату
    - Проверить расположение редактора кода
    - Проверить доступность основных игровых кнопок
    - Проверить читаемость текста и элементов интерфейса
    - Проверить возможность выполнения основных игровых действий
  expected-result: |
    - Интерфейс понятен и удобен для использования
    - Основные элементы доступны пользователю
    - Элементы интерфейса не перекрывают друг друга

- summary: |
    Проверка скорости загрузки основных страниц
  requirement: |
    Сайт оптимизирован для высокой скорости работы
  prerequisites: |
    - Пользователь имеет стабильное интернет-соединение
  test-data: |
    - Главная страница
    - Страница рейтинга
    - Игровая комната
    - Профиль пользователя
  steps:
    - Открыть главную страницу
    - Измерить время загрузки страницы
    - Перейти на страницу рейтинга
    - Измерить время загрузки
    - Открыть игровую комнату
    - Измерить время загрузки
    - Открыть профиль пользователя
    - Измерить время загрузки
  expected-result: |
    - Страницы загружаются без длительных задержек
    - Основные элементы интерфейса отображаются корректно
    - Пользователь может взаимодействовать с сайтом без заметных задержек

- summary: |
    Проверка защиты персональных данных пользователя
  requirement: |
    Сайт безопасен и защищает персональные данные пользователей
  prerequisites: |
    - Пользователь зарегистрирован и авторизован
  test-data: |
    - Данные авторизованного пользователя
    - Учетные данные для входа
  steps:
    - Открыть сайт
    - Проверить использование HTTPS
    - Открыть инструменты разработчика
    - Проверить передачу данных авторизации в сетевых запросах
    - Проверить отсутствие пароля в открытом виде в URL и клиентских логах
  expected-result: |
    - Соединение защищено HTTPS
    - Пароль не передается и не хранится в открытом виде
    - Персональные данные не раскрываются посторонним пользователям

- summary: |
    Проверка адаптивности интерфейса на мобильных устройствах
  requirement: |
    Сайт корректно отображается и удобен на мобильных устройствах
  prerequisites: |
    - Пользователь открыл сайт на мобильном устройстве или в режиме эмуляции
  test-data: |
    - Разрешение 375x667
    - Разрешение 440x956
  steps:
    - Открыть главную страницу при разрешении 375x667
    - Проверить отображение основных элементов
    - Открыть игровую комнату
    - Проверить отображение редактора и панели управления
    - Изменить разрешение на 440x956
    - Повторить проверку основных элементов
  expected-result: |
    - Интерфейс адаптируется под размер экрана
    - Основные элементы не обрезаются
    - Отсутствует нежелательная горизонтальная прокрутка
    - Игровые элементы остаются доступными

- summary: |
    Проверка совместимости сайта с популярными браузерами
  requirement: |
    Сайт совместим с последними версиями популярных браузеров Chrome, Firefox, Safari, Edge
  prerequisites: |
    - Установлены последние стабильные версии проверяемых браузеров
  test-data: |
    - Google Chrome
    - Mozilla Firefox
    - Safari
    - Microsoft Edge
  steps:
    - Открыть сайт в Google Chrome
    - Проверить загрузку главной страницы
    - Создать игровую комнату
    - Открыть сайт в Mozilla Firefox
    - Повторить проверку
    - Открыть сайт в Safari
    - Повторить проверку
    - Открыть сайт в Microsoft Edge
    - Повторить проверку
  expected-result: |
    - Сайт корректно открывается во всех проверяемых браузерах
    - Основные элементы интерфейса отображаются одинаково корректно
    - Игровая функциональность работает без критических ошибок

- summary: |
    Проверка работы сайта при высокой одновременной нагрузке
  requirement: |
    Сайт выдерживает высокую нагрузку — не менее 1000 одновременных пользователей без деградации работы
  prerequisites: |
    - Подготовлено окружение для нагрузочного тестирования
    - Настроен инструмент нагрузочного тестирования
  test-data: |
    - Количество виртуальных пользователей: 1000
    - Основные сценарии: авторизация, создание игры, подключение к игре
  steps:
    - Запустить нагрузочный тест на 1000 виртуальных пользователей
    - Выполнить сценарии авторизации
    - Выполнить сценарии создания и подключения к играм
    - Контролировать время ответа сервера
    - Проверить наличие ошибок и отказов
  expected-result: |
    - Сайт обрабатывает не менее 1000 одновременных пользователей
    - Нет критических ошибок и массовых отказов
    - Время ответа остается в допустимых пределах
    - Основная функциональность сохраняет работоспособность

- summary: |
    Проверка изоляции выполнения пользовательского кода
  requirement: |
    Выполнение пользовательского кода происходит в изолированной среде sandbox с лимитами по времени и памяти
  prerequisites: |
    - Пользователь находится в игровой комнате
  test-data: |
    - Обычное решение задачи
    - Бесконечный цикл
    - Код с чрезмерным потреблением памяти
  steps:
    - Ввести обычное решение задачи
    - Отправить решение на проверку
    - Дождаться результата
    - Ввести код с бесконечным циклом
    - Отправить код на проверку
    - Проверить завершение выполнения по таймауту
    - Проверить выполнение кода с чрезмерным потреблением памяти
  expected-result: |
    - Корректный код выполняется и проверяется
    - Бесконечный цикл останавливается по достижении лимита времени
    - Превышение лимита памяти корректно обрабатывается
    - Выполнение пользовательского кода не влияет на безопасность сервера

- summary: |
    Проверка стабильности доступности сервиса
  requirement: |
    Сервис стабильно доступен для реальных пользователей и устойчив к сбоям
  prerequisites: |
    - Сервис доступен
    - Пользователь авторизован
  test-data: |
    - Главная страница
    - Игровая комната
    - Профиль пользователя
  steps:
    - Открыть главную страницу
    - Перейти в игровую комнату
    - Выполнить несколько игровых действий
    - Обновить страницу
    - Проверить восстановление интерфейса
  expected-result: |
    - Сервис остается доступным
    - Пользователь может выполнять основные действия
    - После обновления страницы интерфейс корректно восстанавливается

- summary: |
    Проверка одновременного начала игры для обоих игроков
  requirement: |
    Оба игрока начинают раунд одновременно и в равных условиях
  prerequisites: |
    - Два игрока подключены к одной игровой комнате
  test-data: |
    - Игрок 1: user1
    - Игрок 2: user2
  steps:
    - Дождаться подключения обоих игроков
    - Проверить отображение обратного отсчета до начала игры
    - Дождаться окончания обратного отсчета
    - Проверить доступность редакторов обоих игроков
  expected-result: |
    - Оба игрока получают одинаковый сигнал о начале игры
    - Оба игрока начинают решать одну задачу одновременно
    - Игроки находятся в равных игровых условиях

- summary: |
    Проверка невозможности просмотра эталонного решения до завершения игры
  requirement: |
    Игроки не могут подсмотреть эталонное решение, обойти тесты или сфальсифицировать результат
  prerequisites: |
    - Пользователь находится в активной игровой комнате
  test-data: |
    - Инструменты разработчика браузера
    - Запросы к серверу с игровыми данными
  steps:
    - Начать игровую партию
    - Открыть инструменты разработчика
    - Проверить доступные сетевые запросы
    - Проверить передаваемые игровые данные
    - Попытаться получить эталонное решение до окончания игры
  expected-result: |
    - Эталонное решение недоступно до разрешенного момента
    - Результат игры определяется сервером
    - Пользователь не может самостоятельно изменить результат партии

- summary: |
    Проверка восстановления игры после обрыва интернет-соединения
  requirement: |
    При обрыве связи партия корректно обрабатывается (переподключение, таймаут или завершение)
  prerequisites: |
    - Два игрока находятся в активной игровой комнате
  test-data: |
    - Игрок 1: user1
    - Игрок 2: user2
  steps:
    - Начать игровую партию
    - Отключить интернет-соединение у игрока 1
    - Продолжить игру от имени игрока 2
    - Восстановить интернет-соединение у игрока 1
    - Проверить возможность переподключения к игре
  expected-result: |
    - Система обнаруживает потерю соединения
    - Игроку 2 отображается информация о состоянии соперника
    - При восстановлении соединения игрок 1 может вернуться в игру, если это предусмотрено правилами
    - При истечении таймаута партия корректно завершается

- summary: |
    Проверка обработки выхода игрока из активной партии
  requirement: |
    При выходе одного из игроков партия корректно обрабатывается
  prerequisites: |
    - Два игрока находятся в активной игровой комнате
  test-data: |
    - Игрок 1: user1
    - Игрок 2: user2
  steps:
    - Начать игровую партию
    - Закрыть вкладку браузера игрока 1
    - Проверить состояние игры у игрока 2
    - Дождаться завершения установленного таймаута
  expected-result: |
    - Система обнаруживает выход игрока
    - Соперник получает информацию о состоянии партии
    - Игра завершается или продолжается согласно установленным правилам

- summary: |
    Проверка автоматического подбора случайного соперника
  requirement: |
    Существует механизм подбора соперников (matchmaking) для начала случайной игры
  prerequisites: |
    - Два пользователя авторизованы в системе
    - Оба пользователя находятся на странице создания игры
  test-data: |
    - Игрок 1: user1
    - Игрок 2: user2
  steps:
    - Игрок 1 выбирает режим случайной игры
    - Нажать кнопку начала поиска соперника
    - Игрок 2 выбирает режим случайной игры
    - Нажать кнопку начала поиска соперника
    - Дождаться завершения поиска
